; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = atmelsam
board = due
framework = arduino
lib_deps = ivanseidel/DueTimer@^1.4.7
monitor_speed = 115200
monitor_echo = yes

; --- Programmes à utiliser avec interface_cpl.py --------------------------
; Due émettrice
[env:emitter]
build_src_filter = +<main_tx.cpp>

; Due réceptrice (lecture analogique de A0, seuil automatique)
[env:receiver]
build_src_filter = +<main_rx.cpp>

; --- Programmes de test (mesures) ----------------------------------------
; porteuse continue réglable (moniteur série)
[env:test_porteuse]
build_src_filter = +<test_porteuse.cpp>

; émission autonome en boucle pour les mesures (porteuse, U à 10/25/50k)
[env:test_seul]
build_src_filter = +<test_seul.cpp>
