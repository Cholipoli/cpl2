; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = atmelsam
board = due
framework = arduino
lib_deps = ivanseidel/DueTimer@^1.4.7
monitor_speed = 115200
[env:emitter]
build_src_filter = +<main_tx.cpp>

[env:receiver]
build_src_filter = +<main_rx.cpp>

[env:receiver_compteur]
build_src_filter = +<main_rx_compteur.cpp>


[env:test_porteuse]
build_src_filter = +<test_porteuse.cpp>

[env:test_seul]
build_src_filter = +<test_seul.cpp>
[env:receiver_adc]
build_src_filter = +<main_rx_adc.cpp>
